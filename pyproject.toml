[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-barbossa"
version = "0.1.0"
description = "Launch a native captain and crew inside a Herdr workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["questionary>=2.1,<3"]

[project.scripts]
captain = "captain_barbossa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["captain_barbossa*"]
namespaces = false
